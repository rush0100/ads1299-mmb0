name: Feature request
description: Suggest an enhancement for the host library
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about the Python host (not a request to redistribute TI firmware)
          required: true
