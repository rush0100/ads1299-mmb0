name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  package:
    name: build sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check no firmware shipped
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for p in Path("dist").rglob("*"):
              if p.suffix.lower() in {".bin", ".exe"} or "vendor" in p.parts:
                  bad.append(str(p))
          # Also scan wheel contents briefly via listing archive names
          import zipfile, tarfile
          for art in Path("dist").glob("*"):
              if art.suffix == ".whl":
                  with zipfile.ZipFile(art) as z:
                      for n in z.namelist():
                          if n.endswith(".bin") or "/vendor/" in n:
                              bad.append(f"{art.name}:{n}")
              elif art.name.endswith(".tar.gz"):
                  with tarfile.open(art) as t:
                      for m in t.getmembers():
                          if m.name.endswith(".bin") or "/vendor/" in m.name:
                              bad.append(f"{art.name}:{m.name}")
          if bad:
              raise SystemExit("Proprietary-looking files in package:\n" + "\n".join(bad))
          print("package OK")
          PY
